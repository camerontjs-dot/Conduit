name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Test
        shell: bash
        run: |
          set +e
          swift test > /tmp/conduit-swift-test.log 2>&1
          status=$?
          tail -n 180 /tmp/conduit-swift-test.log
          exit $status
      - name: Build release app
        shell: bash
        run: |
          set +e
          ./scripts/build-app.sh > /tmp/conduit-build.log 2>&1
          status=$?
          tail -n 180 /tmp/conduit-build.log
          exit $status
